<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revamped Image Gen — dev harness</title>
<link rel="stylesheet" href="/fa/css/all.min.css">
<link rel="stylesheet" href="/scripts/extensions/third-party/revampedimagegen/style.css">
<style>
  :root {
    --SmartThemeBodyColor: #dcdcd2; --SmartThemeBlurTintColor: rgba(23, 23, 28, 0.92);
    --SmartThemeBorderColor: rgba(255, 255, 255, 0.13); --SmartThemeQuoteColor: #e3a14b;
    --SmartThemeBlurStrength: 10px; --mainFontSize: 15px; --topBarBlockSize: 44px; --bottomFormBlockSize: 56px;
  }
  /* Copied from SillyTavern (style.css + css/mobile-styles.css): the html transform
     plus a fixed body at <=1000px makes <html> the 0px-tall containing block for
     position:fixed elements — the reason the Studio vanished on phones. */
  html { -webkit-transform: translateZ(0); transform: translateZ(0); -webkit-backface-visibility: hidden; -webkit-perspective: 1000; }
  @media screen and (max-width: 1000px) { body { touch-action: none; overflow: hidden; position: fixed; width: 100%; } }
  html { margin: 0; }
  body { margin: 0; height: 100vh; height: 100dvh; background: #0e0e12; color: var(--SmartThemeBodyColor); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #top-bar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; padding: 0 14px; background: #17171c; border-bottom: 1px solid #2a2a30; z-index: 3000; font-weight: 600; }
  #sheld { position: absolute; top: 44px; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 860px); display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .mes { display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #222; }
  .mes .avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; flex: none; }
  .mes_block { flex: 1; min-width: 0; }
  .ch_name { display: flex; justify-content: space-between; font-weight: 700; }
  .extraMesButtons { display: flex; gap: 10px; opacity: .7; }
  .mes_text img { max-width: 100%; }
  #send_form { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #2a2a30; background: #15151a; height: 56px; box-sizing: border-box; }
  #send_form input { flex: 1; background: #222; border: 1px solid #333; color: inherit; border-radius: 8px; padding: 0 10px; }
  #extensionsMenu { display: none; }
  #extensions_settings2 { display: none; }
  .toast-host { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .toast { background: #2b2b33; padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.4); max-width: 86vw; }
  .toast.error { background: #5a2a30; } .toast.success { background: #234a33; } .toast.warning { background: #5a4520; }
</style>
</head>
<body>
<div id="top-bar">SillyTavern (mock)</div>
<div id="sheld">
  <div id="chat"></div>
  <form id="send_form" onsubmit="return false"><input placeholder="Type a message…"></form>
</div>
<div id="extensionsMenu"></div>
<div id="extensions_settings2"></div>
<div class="toast-host" id="toasts"></div>
<script type="module" src="/harness.js"></script>
</body>
</html>
